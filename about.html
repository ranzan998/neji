<head>

        }

        .container {

        table {

        tr:nth-child(even) {

        th {

            }
        .menu-container {
    position: absolute;

}

.menu-icon {
    font-size: 28px;
    cursor: pointer;
    user-select: none;
}

.menu-links {

}

.menu-links a {

    font-weight: 500;
    padding: 6px 0;
    display: block;
}

.menu-links a:hover {
    text-decoration: underline;
}

</head>

function toggleMenu() {

    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
