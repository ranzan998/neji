<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <title>Login - NEJI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .header {
            display: flex;
            margin-bottom: 40px;
        }
        .title-row {
            display: flex;
            align-items: center;
        }
        .title-container {
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0;
            color: #333;
        }
        .small-neji {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #666;
            margin-top: 0px;
        }
        .logo {
            height: auto;
            width: 120px;
            margin-left: 15px;
        }
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 1000;
        }
        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }
        .menu-links {
            display: none;
            flex-direction: column;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .menu-links a {
            text-decoration: none;
            color: #0a2f66;
            font-weight: 500;
            padding: 6px 0;
            display: block;
        }
        .menu-links a:hover {
            text-decoration: underline;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #0a2f66;
            margin: 0 0 10px 0;
            font-family: 'Montserrat', sans-serif;
        }
        .login-header p {
            color: #666;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0a2f66;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #0a2f66;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }
        .login-btn:hover {
            background-color: #083559;
        }
        .login-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #e1e5e9;
        }
        .divider span {
            background-color: white;
            padding: 0 15px;
            color: #666;
        }
        .email-login-section {
            text-align: center;
        }
        .email-login-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .email-login-btn:hover {
            background-color: #218838;
        }
        .email-login-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .message.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .message.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .message.info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        .back-link a {
            color: #0a2f66;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="title-container">
            <div class="title-row">
                <h1>NEJI</h1>
                <img src="./neji.png" alt="NEJI Network of Earth-Science Jobs India Logo" class="logo">
            </div>
            <div class="small-neji">Network of Earth-Science Jobs, India</div>
        </div>
        <div class="menu-container">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="menu-links" id="menuLinks">
                <a href="./index.html">Home</a>
                <a href="./institutes.html">Institutes</a>
                <a href="./about.html">Who are we?</a>
            </div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to your NEJI account</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="email-login-section">
            <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                Don't have a password? Get a secure login link sent to your email.
            </p>
            <button class="email-login-btn" id="emailLoginBtn" onclick="sendEmailLogin()">
                Send Login Link to Email
            </button>
        </div>

        <div class="back-link">
            <a href="./index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        // State management
        let isLoading = false;

        function toggleMenu() {
            const menu = document.getElementById("menuLinks");
            menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Hide message after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function setLoading(loading) {
            isLoading = loading;
            const loginBtn = document.getElementById('loginBtn');
            const emailLoginBtn = document.getElementById('emailLoginBtn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            loginBtn.disabled = loading;
            emailLoginBtn.disabled = loading;
            emailInput.disabled = loading;
            passwordInput.disabled = loading;

            if (loading) {
                loginBtn.textContent = 'Signing In...';
                emailLoginBtn.textContent = 'Sending...';
            } else {
                loginBtn.textContent = 'Sign In';
                emailLoginBtn.textContent = 'Send Login Link to Email';
            }
        }

        // Regular login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isLoading) return;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            // Simulate login process
            setLoading(true);
            showMessage('Verifying credentials...', 'info');

            // Simulate API call
            setTimeout(() => {
                setLoading(false);
                
                // Demo: simulate successful login
                if (email && password.length >= 6) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 1500);
                } else {
                    showMessage('Invalid credentials. Please try again.', 'error');
                }
            }, 2000);
        });

        // Email-based authentication
        function sendEmailLogin() {
            if (isLoading) return;

            const email = document.getElementById('email').value;
            
            if (!email) {
                showMessage('Please enter your email address first.', 'error');
                document.getElementById('email').focus();
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'error');
                document.getElementById('email').focus();
                return;
            }

            setLoading(true);
            showMessage('Sending login link to your email...', 'info');

            // Simulate sending email
            setTimeout(() => {
                setLoading(false);
                showMessage(`Login link sent to ${email}! Please check your inbox and follow the link to sign in.`, 'success');
                
                // In a real implementation, this would make an API call to send the email
                console.log('Email login link would be sent to:', email);
                
                // Generate a mock login token (in real app, this would be done server-side)
                const loginToken = generateLoginToken();
                console.log('Generated login token:', loginToken);
                
                // Simulate receiving the email and clicking the link
                setTimeout(() => {
                    if (confirm('Simulate clicking the email login link? (This is just for demo purposes)')) {
                        handleEmailLogin(loginToken, email);
                    }
                }, 3000);
            }, 2000);
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function generateLoginToken() {
            // Simple token generation for demo purposes
            return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        }

        function handleEmailLogin(token, email) {
            // In a real implementation, this would verify the token with the server
            showMessage('Email login successful! Welcome back.', 'success');
            
            // Store user session (in real app, this would be handled more securely)
            const userData = {
                email: email,
                loginMethod: 'email',
                loginTime: new Date().toISOString()
            };
            
            // Store in memory for this demo (in real app, use secure session management)
            window.currentUser = userData;
            
            setTimeout(() => {
                window.location.href = './index.html';
            }, 1500);
        }

        // Handle email login from URL parameters (for when user clicks email link)
        function checkEmailLoginFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            
            if (token && email) {
                showMessage('Verifying email login...', 'info');
                setTimeout(() => {
                    handleEmailLogin(token, email);
                }, 1000);
            }
        }

        // Check for email login on page load
        document.addEventListener('DOMContentLoaded', checkEmailLoginFromUrl);
    </script>
</body>
</html>
