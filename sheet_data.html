<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets DataTable - 2 Columns</title>
    <link
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Google Sheets DataTable - Name & Email Only</h2>
        <table id="dataTable" class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Job position</th>
                    <th>Organization name</th>
                    <th>Location</th>
                    <th>Posted date</th>
                    
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec'; // Replace with your new deployment URL
            
            // Configure which columns to display - easily changeable
            const columnsToShow = ['jobTitle', 'affiliation','location','timestamp']; // Change these to show different columns

            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('tableBody');
                    data.forEach(row => {
                        let tr = document.createElement('tr');
                        let cellsHtml = '';
                        
                        // Dynamically build cells based on columnsToShow array
                        columnsToShow.forEach(column => {
                            cellsHtml += `<td>${row[column] || ''}</td>`;
                        });
                        
                        tr.innerHTML = cellsHtml;
                        tableBody.appendChild(tr);
                    });
                    
                    // Initialize DataTable using vanilla JavaScript
                    new DataTable('#dataTable');
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
</body>
</html>
