<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean and Earth science Jobs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .header {
            display: flex;
            margin-bottom: 20px;
            justify-content: space-between;
        }
        .title-row {
            display: flex;
            align-items: center;
        }
        .title-container {
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0;
            color: #333;
        }
        .small-neji {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #666;
            margin-top: 0px;
        }
        .logo {
            height: auto;
            width: 120px;
            margin-left: 15px;
        }
        .container {
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        tr {
            border-bottom: 1px solid #ddd;
        }
        td {
            padding: 12px 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .table-container {
            overflow-x: auto;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        th {
            font-weight: bold;
            color: #0a2f66; /* dark blue */
            background-color: #eef3fb;
            text-align: left;
        }
        .menu-container {
            text-align: right;
            z-index: 1000;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        .menu-links {
            display: none;
            flex-direction: column;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: absolute;
            right: 20px;
        }

        .menu-links a {
            text-decoration: none;
            color: #0a2f66;
            font-weight: 500;
            padding: 6px 0;
            display: block;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }
        
        /* Form styles */
        .job-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #ddd;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section h3 {
            color: #0a2f66;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
            gap: 20px;
        }

        .form-group {
            flex: 1 1 300px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-field-error {
            border-color: #dc3545 !important;
        }

        .form-field-valid {
            border-color: #28a745;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background-color: #0a2f66;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #084083;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .button-cancel {
            background-color: #6c757d;
        }

        .button-cancel:hover {
            background-color: #5a6268;
        }
        
        #statusMessage {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 10px;
            }
            .form-group {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-container">
            <div class="title-row">
                <h1>NEJI</h1>
                <img src="./neji.png" alt="NEJI Network of Earth-Science Jobs India Logo" class="logo" onerror="this.style.display='none'">
            </div>
            <div class="small-neji">Network of Earth-Science Jobs, India</div>
        </div>
        <div class="menu-container">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="menu-links" id="menuLinks">
          	   <a href="./website.html">Home</a>
    	 	    <a href="./institutes.html">Institutes</a>
   	 	    <a href="./put_your_word.html">Put your word out</a>
   	 	    <a href="./about.html">Who are we?</a>
             </div>
        </div>
    </div>

    <div class="container">
        <h2>Post a new job</h2>
        <p>Use this form to submit a new job posting to the NEJI network. Fields marked with * are required.</p>
        
        <div id="statusMessage"></div>
        
        <form id="jobPostingForm" class="job-form">
            <div class="form-section">
                <h3>Contact Information</h3>
                <div class="form-row">
                     <div class="form-group">
                        <label for="fullName">Full Name*</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="affiliation">Affiliation/Institute*</label>
                        <input type="text" id="affiliation" name="affiliation" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department">
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h3>Job Details</h3>
                <div class="form-row">

                    <div class="form-group">
                        <label for="jobType">Job Type*</label>
                        <select id="jobType" name="jobType" required>
                            <option value="">Select Job Type</option>
                            <option value="phd">PhD Position</option>
                            <option value="postdoc">Postdoctoral Fellowship</option>
                            <option value="faculty">Faculty Position</option>
                            <option value="researcher">Researcher</option>
                            <option value="technician">Technician</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                   <div class="form-group">
                        <label for="jobTitle">other</label>
                        <input type="text" id="jobTitle" name="jobTitle">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location*</label>
                        <input type="text" id="location" name="location" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration*</label>
                        <input type="text" id="duration" name="duration" placeholder="e.g., 2 years, Permanent" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="jobDescription">Short Description of the Job*</label>
                    <textarea id="jobDescription" name="jobDescription" placeholder="Briefly describe the job role and responsibilities" required></textarea>
                </div>
            </div>
            
            <div class="form-section">
                <h3>Requirements</h3>
                <div class="form-group">
                    <label for="essentialQualities">Essential Qualities*</label>
                    <textarea id="essentialQualities" name="essentialQualities" placeholder="List essential qualities and skills required for this position" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="desirableQualities">Desirable Qualities</label>
                    <textarea id="desirableQualities" name="desirableQualities" placeholder="List qualities and skills that would be advantageous but not essential"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="minQualification">Minimum Qualification*</label>
                        <select id="minQualification" name="minQualification" required>
                            <option value="">Select Minimum Qualification</option>
                            <option value="bachelor">Bachelor's Degree</option>
                            <option value="master">Master's Degree</option>
                            <option value="phd">PhD</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="experience">Experience Required (years)*</label>
                        <input type="number" id="experience" name="experience" min="0" max="30" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="otherRequirements">Other Requirements</label>
                    <textarea id="otherRequirements" name="otherRequirements" placeholder="Any other requirements or information"></textarea>
                </div>
            </div>
            
            <div class="form-section">
                <h3>Additional Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="salary">Salary/Stipend (optional)</label>
                        <input type="text" id="salary" name="salary" placeholder="e.g., ₹30,000 per month, As per institute norms">
                    </div>
                    <div class="form-group">
                        <label for="deadline">Application Deadline*</label>
                        <input type="date" id="deadline" name="deadline" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="applicationProcess">How to Apply*</label>
                    <textarea id="applicationProcess" name="applicationProcess" placeholder="Describe the application process" required></textarea>
                </div>
                <div class="form-group">
                    <label for="link">link</label>
                    <textarea id="link" name="link" placeholder="please provide link of advt if available" required></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="button-cancel" onclick="resetForm()">Cancel</button>
                <button type="submit" id="submitButton">Submit Job Posting</button>
            </div>
        </form>
    </div>

    <script>
        // Replace this URL with your Google Apps Script Web App URL after deployment
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec';
        
        function toggleMenu() {
            const menu = document.getElementById("menuLinks");
            menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        }
        
        // Form submission handler
        document.getElementById('jobPostingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            // URL validation removed - using configured Google Apps Script URL
            
            submitToGoogleSheets();
        });
        
        function validateForm() {
            const requiredFields = document.querySelectorAll('[required]');
            let isValid = true;
            
            // Clear previous validation styling
            document.querySelectorAll('.form-field-error').forEach(field => {
                field.classList.remove('form-field-error');
            });
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.classList.add('form-field-error');
                    isValid = false;
                } else {
                    field.classList.remove('form-field-error');
                    field.classList.add('form-field-valid');
                }
            });
            
            // Email validation
            const emailField = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailField.value && !emailRegex.test(emailField.value)) {
                emailField.classList.add('form-field-error');
                isValid = false;
                showStatusMessage('Please enter a valid email address.', 'error');
            }
            
            // Date validation (deadline should be in the future)
            const deadlineField = document.getElementById('deadline');
            if (deadlineField.value) {
                const selectedDate = new Date(deadlineField.value);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                if (selectedDate < today) {
                    deadlineField.classList.add('form-field-error');
                    isValid = false;
                    showStatusMessage('Application deadline should be in the future.', 'error');
                }
            }
            
            if (!isValid && !document.querySelector('.error')) {
                showStatusMessage('Please fill in all required fields correctly.', 'error');
            }
            
            return isValid;
        }
        
        function submitToGoogleSheets() {
            const submitButton = document.getElementById('submitButton');
            const originalText = submitButton.textContent;
            
            // Show loading state
            submitButton.textContent = 'Submitting...';
            submitButton.disabled = true;
            showStatusMessage('Submitting your job posting...', 'loading');
            
            // Collect form data
            const formData = new FormData();
            
            // Add timestamp
            formData.append('timestamp', new Date().toLocaleString());
            
            // Add all form fields
            const formFields = [
                'fullName', 'email', 'phone', 'affiliation', 'department',
                'jobTitle', 'jobType', 'location', 'duration', 'jobDescription',
                'essentialQualities', 'desirableQualities', 'minQualification',
                'experience', 'otherRequirements', 'salary', 'deadline', 'applicationProcess','link'
            ];
            
            formFields.forEach(fieldName => {
                const field = document.getElementById(fieldName);
                let value = field.value || '';
                
                // Use the actual value for data consistency
                formData.append(fieldName, value);
            });
            
            // Submit to Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.result === 'success') {
                    showStatusMessage('Job posting submitted successfully! Your data has been saved to Google Sheets.', 'success');
                    document.getElementById('jobPostingForm').reset();
                    clearValidationStyling();
                } else {
                    throw new Error(data.error || 'Unknown error occurred');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                let errorMessage = 'Error submitting form: ';
                
                if (error.message.includes('HTTP error')) {
                    errorMessage += 'Server error. Please try again later.';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage += 'Network error. Please check your connection.';
                } else {
                    errorMessage += error.message;
                }
                
                showStatusMessage(errorMessage, 'error');
            })
            .finally(() => {
                // Reset button state
                submitButton.textContent = originalText;
                submitButton.disabled = false;
            });
        }
        
        function resetForm() {
            document.getElementById('jobPostingForm').reset();
            clearValidationStyling();
            // Hide status message
            document.getElementById('statusMessage').style.display = 'none';
        }
        
        function clearValidationStyling() {
            // Reset any validation styling
            const fields = document.querySelectorAll('input, textarea, select');
            fields.forEach(field => {
                field.classList.remove('form-field-error', 'form-field-valid');
            });
        }
        
        function showStatusMessage(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
            
            // Auto-hide success and loading messages after 5 seconds
            if (type === 'success' || type === 'loading') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
            
            // Scroll to status message
            statusDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Add real-time validation feedback
        document.querySelectorAll('input, textarea, select').forEach(field => {
            field.addEventListener('blur', function() {
                if (this.hasAttribute('required') && !this.value.trim()) {
                    this.classList.add('form-field-error');
                } else {
                    this.classList.remove('form-field-error');
                    if (this.value.trim()) {
                        this.classList.add('form-field-valid');
                    }
                }
            });
            
            field.addEventListener('input', function() {
                if (this.classList.contains('form-field-error') && this.value.trim()) {
                    this.classList.remove('form-field-error');
                    this.classList.add('form-field-valid');
                }
            });
        });
    </script>
</body>
</html>
