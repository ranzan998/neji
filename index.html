<script>
function toggleMenu() {
    const menu = document.getElementById("menuLinks");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}

// Tab functionality
function showTab(tabName) {
    // Hide all tab contents
    const tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(content => {
        content.classList.remove('active');
    });
    
    // Remove active class from all tab buttons
    const tabButtons = document.querySelectorAll('.tab-button');
    tabButtons.forEach(button => {
        button.classList.remove('active');
    });
    
    // Show the selected tab content
    document.getElementById(tabName).classList.add('active');
    
    // Add active class to the clicked button
    event.target.classList.add('active');
    
    // Initialize DataTable for conferences if not already done
    if (tabName === 'conferences' && !window.conferencesTableInitialized) {
        loadConferencesData();
    }
}

// Function to format date to IST (date only, no time)
function formatDateToIST(dateStr) {
    if (!dateStr || dateStr.trim() === '') return '';
    
    try {
        let date = new Date(dateStr);
        
        // If initial parsing fails, try different formats
        if (isNaN(date.getTime())) {
            // Try DD/MM/YYYY or DD-MM-YYYY format
            const ddmmyyyy = dateStr.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (ddmmyyyy) {
                const day = parseInt(ddmmyyyy[1]);
                const month = parseInt(ddmmyyyy[2]) - 1; // Month is 0-indexed
                const year = parseInt(ddmmyyyy[3]);
                date = new Date(year, month, day);
            }
        }
        
        if (isNaN(date.getTime())) {
            return dateStr; // Return original if can't parse
        }
        
        // Format to IST date (DD/MM/YYYY)
        const istDate = new Date(date.toLocaleString("en-US", {timeZone: "Asia/Kolkata"}));
        const day = istDate.getDate().toString().padStart(2, '0');
        const month = (istDate.getMonth() + 1).toString().padStart(2, '0');
        const year = istDate.getFullYear();
        
        return `${day}/${month}/${year}`;
    } catch (error) {
        console.error('Error formatting date:', error);
        return dateStr;
    }
}

// Function to parse date strings and convert to sortable format
function parseDate(dateStr) {
    if (!dateStr || dateStr.trim() === '') return 0; // Return 0 for empty dates
    
    // Clean the date string
    dateStr = dateStr.trim();
    
    // Try parsing as standard date first
    let date = new Date(dateStr);
    if (!isNaN(date.getTime())) return date.getTime();
    
    // Try common Indian date formats: DD/MM/YYYY, DD-MM-YYYY
    const ddmmyyyy = dateStr.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (ddmmyyyy) {
        const day = parseInt(ddmmyyyy[1]);
        const month = parseInt(ddmmyyyy[2]) - 1; // Month is 0-indexed
        const year = parseInt(ddmmyyyy[3]);
        date = new Date(year, month, day);
        if (!isNaN(date.getTime())) return date.getTime();
    }
    
    // Try YYYY-MM-DD format
    const yyyymmdd = dateStr.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (yyyymmdd) {
        const year = parseInt(yyyymmdd[1]);
        const month = parseInt(yyyymmdd[2]) - 1;
        const day = parseInt(yyyymmdd[3]);
        date = new Date(year, month, day);
        if (!isNaN(date.getTime())) return date.getTime();
    }
    
    // If all parsing fails, return 0
    console.log('Could not parse date:', dateStr);
    return 0;
}

// Function to handle date sorting
function applySorting(table, sortOrder) {
    if (table) {
        table.order([3, sortOrder]).draw();
    }
}

            console.log('Conferences is array:', Array.isArray(data));
            
            // Handle different possible response formats
            let processedData;
            if (Array.isArray(data)) {
                processedData = data;
            } else if (data && typeof data === 'object') {
                // If it's an object, check if it has a data property or similar
                if (Array.isArray(data.data)) {
                    processedData = data.data;
                } else if (Array.isArray(data.rows)) {
                    processedData = data.rows;
                } else if (Array.isArray(data.conferences)) {
                    processedData = data.conferences;
                } else {
                    // Try to convert object to array
                    processedData = Object.values(data);
                }
            } else {
                throw new Error('Invalid data format received');
            }
            
            if (!Array.isArray(processedData)) {
                throw new Error('Unable to process data into array format');
            }
            
            conferencesData = processedData; // Store data globally for virtual pages
            conferencesTableBody.innerHTML = '';
            
            if (processedData.length === 0) {
                conferencesTableBody.innerHTML = '<tr><td colspan="5" class="loading">No conferences found.</td></tr>';
                return;
            }
            
            processedData.forEach((row, index) => {
                console.log(`Conference row ${index}:`, row);
                let tr = document.createElement('tr');
                
                // Format dates for display
                const formattedStartDate = formatDateToIST(row.eventStartDate);
                const formattedEndDate = formatDateToIST(row.eventEndDate);
                const formattedRegDeadline = formatDateToIST(row.registrationDeadline);
                
                // Check if external link/website exists
// Always create virtual page for event title
let titleCell = `<td><a href="#" class="virtual-link" onclick="showConferenceDetail(conferencesData[${index}]); return false;">${row.eventTitle || ''} 📄 </a></td>`;

// Check if external link exists for registration deadline
let regDeadlineCell;
if (row.eventWebsite && row.eventWebsite.trim() !== '') {
    // External link exists - embed in registration deadline
    regDeadlineCell = `<td><a href="${row.eventWebsite}" target="_blank" rel="noopener noreferrer">${formattedRegDeadline} 🔗</a></td>`;
} else {
    // No external link - just show deadline
    regDeadlineCell = `<td>${formattedRegDeadline}</td>`;
}

tr.innerHTML = `
    ${titleCell}
    <td>${row.eventLocation || ''}</td>
    <td>${formattedStartDate}</td>
    <td>${formattedEndDate}</td>
    ${regDeadlineCell}
`;
                conferencesTableBody.appendChild(tr);
            });
            
            // Initialize DataTable for conferences
            if (conferencesTable) {
                conferencesTable.destroy();
            }
            
            conferencesTable = $('#conferencesTable').DataTable({
                responsive: {
                    details: {
                        type: 'column',
                        target: 'tr'
                    }
                },
                autoWidth: false,
                scrollX: false,
                scrollCollapse: true,
                fixedHeader: false,
                order: [[4, 'desc']], // Default sort by start date
                columnDefs: [
                    { width: "30%", targets: 0, className: "text-wrap" },
                    { width: "25%", targets: 1, className: "text-wrap" },
                    { width: "15%", targets: 2, className: "text-wrap" },
                    { width: "15%", targets: 3, className: "text-wrap" },
                    { width: "15%", targets: 4, className: "text-wrap" }
                ],
                drawCallback: function() {
                    this.api().columns.adjust();
                },
                initComplete: function() {
                    this.api().columns.adjust();
                }
            });
            
            window.conferencesTableInitialized = true;
        })
        .catch(error => {
            console.error('Error fetching conferences data:', error);
            conferencesTableBody.innerHTML = `<tr><td colspan="5" class="loading">Error loading conferences data: ${error.message}</td></tr>`;
        });
}

document.addEventListener('DOMContentLoaded', function() {
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec';
    
    // Configure which columns to display - easily changeable
    const columnsToShow = ['jobType', 'affiliation', 'location', 'timestamp'];
    fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
            jobsData = data; // Store data globally
            const tableBody = document.getElementById('tableBody');
            
            data.forEach((row, index) => {
                let tr = document.createElement('tr');
                let cellsHtml = '';
                
                // Build cells based on columnsToShow array
columnsToShow.forEach(column => {
    if (column === 'jobType') {
        // Always create virtual page for job title
        cellsHtml += `<td><a href="#" class="virtual-link" onclick="showJobDetail(jobsData[${index}]); return false;">${row[column] || ''} 📄</a></td>`;
    } else if (column === 'timestamp') {
        // Format job posted date to IST and check for external link
        const formattedDate = formatDateToIST(row[column]);
        if (row['link'] && row['link'].trim() !== '') {
            // External link exists - embed in timestamp
            cellsHtml += `<td><a href="${row['link']}" target="_blank" rel="noopener noreferrer">${formattedDate} 🔗</a></td>`;
        } else {
            // No external link - just show date
            cellsHtml += `<td>${formattedDate}</td>`;
        }
    } else {
        cellsHtml += `<td>${row[column] || ''}</td>`;
    }
});
                
                tr.innerHTML = cellsHtml;
                tableBody.appendChild(tr);
            });
            
            // First, let's add timestamps to our data for proper sorting
            console.log('Sample data for debugging:', data.slice(0, 3));
            data.forEach(row => {
                row.sortableDate = parseDate(row.timestamp);
                console.log('Date:', row.timestamp, '-> Sortable:', row.sortableDate, '-> Readable:', new Date(row.sortableDate));
            });
            
            // Initialize DataTable with custom date sorting
            dataTable = $('#dataTable').DataTable({
                responsive: {
                    details: {
                        type: 'column',
                        target: 'tr'
                    }
                },
                autoWidth: false,
                scrollX: false,
                scrollCollapse: true,
                fixedHeader: false,
                order: [[3, 'desc']], // Default sort by date column (newest first)
                columnDefs: [
                    { width: "35%", targets: 0, className: "text-wrap" },
                    { width: "30%", targets: 1, className: "text-wrap" },
                    { width: "20%", targets: 2, className: "text-wrap" },
                    { 
                        width: "15%", 
                        targets: 3, 
                        className: "text-wrap",
                        render: function(data, type, row, meta) {
                            if (type === 'sort' || type === 'type') {
                                // Use the pre-calculated sortable date
                                return jobsData[meta.row] ? jobsData[meta.row].sortableDate : 0;
                            }
                            return data; // Return original data for display
                        }
                    }
                ],
                drawCallback: function() {
                    // Ensure header and body alignment after each redraw
                    this.api().columns.adjust();
                },
                initComplete: function() {
                    // Force column adjustment after initialization
                    this.api().columns.adjust();
                    
                    // Add window resize handler to maintain alignment
                    $(window).on('resize', () => {
                        clearTimeout(window.resizeTimer);
                        window.resizeTimer = setTimeout(() => {
                            this.api().columns.adjust();
                        }, 250);
                    });
                }
            });
            setTimeout(() => {
                if (!window.conferencesTableInitialized) {
                    loadConferencesData();
                }
            }, 200);
        })
        .catch(error => console.error('Error fetching data:', error));
});
