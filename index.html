<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean and Earth science Jobs</title>
        <link
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .header {
            display: flex;
            margin-bottom: 20px;
        }
        .title-row {
            display: flex;
            align-items: center;
        }
        .title-container {
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0;
            color: #333;
        }
        .small-neji {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #666;
            margin-top: 0px;
        }
        .logo {
            height: auto;
            width: 120px;
            margin-left: 15px;
        }
        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 15px;
        }
        
        /* Responsive table styling */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        
        table {
            width: 100% !important;
            border-collapse: collapse;
            table-layout: auto;
            min-width: 100%;
        }
        
        .dataTables_wrapper {
            width: 100%;
        }
        
        .dataTables_wrapper .dataTables_scroll {
            width: 100%;
        }
        
        .dataTables_wrapper .dataTables_scrollBody {
            width: 100%;
        }
        
        tr {
            border-bottom: 1px solid #ddd;
        }
        
        td, th {
            padding: 12px 15px;
            word-wrap: break-word;
            white-space: normal;
            vertical-align: top;
        }
        
        th:nth-child(1), td:nth-child(1) {
            width: 35%;
            min-width: 200px;
        }
        
        th:nth-child(2), td:nth-child(2) {
            width: 30%;
            min-width: 150px;
        }
        
        th:nth-child(3), td:nth-child(3) {
            width: 20%;
            min-width: 120px;
        }
        
        th:nth-child(4), td:nth-child(4) {
            width: 15%;
            min-width: 100px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        th {
            font-weight: bold;
            color: #0a2f66;
            background-color: #eef3fb;
            text-align: left;
        }
        
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 1000;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        .menu-links {
            display: none;
            flex-direction: column;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .menu-links a {
            text-decoration: none;
            color: #0a2f66;
            font-weight: 500;
            padding: 6px 0;
            display: block;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }
        
        /* Job detail modal/page styles */
        .job-detail-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        
        .job-detail-content {
            background-color: #fefefe;
            margin: 2% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            right: 20px;
            top: 15px;
        }
        
        .close-btn:hover {
            color: #000;
        }
        
        .job-detail-title {
            color: #0a2f66;
            margin-bottom: 20px;
            padding-right: 40px;
        }
        
        .job-detail-section {
            margin-bottom: 20px;
        }
        
        .job-detail-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .job-detail-value {
            color: #666;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .virtual-link {
            color: #0066cc;
            cursor: pointer;
            text-decoration: none;
        }
        
        .virtual-link:hover {
            text-decoration: underline;
            color: #004499;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
            
            .logo {
                width: 80px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .small-neji {
                font-size: 14px;
            }
            
            .job-detail-content {
                width: 95%;
                margin: 5% auto;
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            th, td {
                padding: 6px 8px;
                font-size: 12px;
            }
            
            th:nth-child(1), td:nth-child(1) {
                min-width: 150px;
            }
            
            th:nth-child(2), td:nth-child(2) {
                min-width: 120px;
            }
            
            th:nth-child(3), td:nth-child(3) {
                min-width: 100px;
            }
            
            th:nth-child(4), td:nth-child(4) {
                min-width: 80px;
            }
        }
    </style>
</head>

<script>
function toggleMenu() {
    const menu = document.getElementById("menuLinks");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}

// Job detail modal functions
function showJobDetail(jobData) {
    const modal = document.getElementById('jobDetailModal');
    const content = document.getElementById('jobDetailContent');
    
    // Helper function to safely display data
    function displayField(value, defaultText = 'Not specified') {
        return value && value.trim() !== '' ? value : defaultText;
    }
    
    // Helper function to format text with line breaks
    function formatText(text) {
        if (!text || text.trim() === '') return 'Not specified';
        return text.replace(/\n/g, '<br>');
    }
    
    // Populate modal with comprehensive job data
    content.innerHTML = `
        <span class="close-btn" onclick="closeJobDetail()">&times;</span>
        <h2 class="job-detail-title">${displayField(jobData.jobTitle, 'Job Position')}</h2>
        
        <!-- Basic Information -->
        <div class="job-detail-section">
            <div class="job-detail-label">Organization:</div>
            <div class="job-detail-value">${displayField(jobData.affiliation)}</div>
        </div>
        
        <div class="job-detail-section">
            <div class="job-detail-label">Location:</div>
            <div class="job-detail-value">${displayField(jobData.location)}</div>
        </div>
        
        <div class="job-detail-section">
            <div class="job-detail-label">Posted Date:</div>
            <div class="job-detail-value">${displayField(jobData.timestamp)}</div>
        </div>
        
        <!-- Job Details -->
        ${jobData.jobType ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Job Type:</div>
            <div class="job-detail-value">${jobData.jobType}</div>
        </div>
        ` : ''}
        
        ${jobData.department ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Department:</div>
            <div class="job-detail-value">${jobData.department}</div>
        </div>
        ` : ''}
        
        ${jobData.description ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Job Description:</div>
            <div class="job-detail-value">${formatText(jobData.description)}</div>
        </div>
        ` : ''}
        
        ${jobData.responsibilities ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Key Responsibilities:</div>
            <div class="job-detail-value">${formatText(jobData.responsibilities)}</div>
        </div>
        ` : ''}
        
        ${jobData.requirements ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Requirements & Qualifications:</div>
            <div class="job-detail-value">${formatText(jobData.requirements)}</div>
        </div>
        ` : ''}
        
        ${jobData.qualifications ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Educational Qualifications:</div>
            <div class="job-detail-value">${formatText(jobData.qualifications)}</div>
        </div>
        ` : ''}
        
        ${jobData.experience ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Experience Required:</div>
            <div class="job-detail-value">${displayField(jobData.experience)}</div>
        </div>
        ` : ''}
        
        ${jobData.skills ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Required Skills:</div>
            <div class="job-detail-value">${formatText(jobData.skills)}</div>
        </div>
        ` : ''}
        
        <!-- Compensation & Benefits -->
        ${jobData.salary ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Salary/Compensation:</div>
            <div class="job-detail-value">${displayField(jobData.salary)}</div>
        </div>
        ` : ''}
        
        ${jobData.benefits ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Benefits:</div>
            <div class="job-detail-value">${formatText(jobData.benefits)}</div>
        </div>
        ` : ''}
        
        ${jobData.workType ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Work Type:</div>
            <div class="job-detail-value">${displayField(jobData.workType)}</div>
        </div>
        ` : ''}
        
        <!-- Application Information -->
        ${jobData.deadline ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Application Deadline:</div>
            <div class="job-detail-value">${displayField(jobData.deadline)}</div>
        </div>
        ` : ''}
        
        ${jobData.applicationProcess ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Application Process:</div>
            <div class="job-detail-value">${formatText(jobData.applicationProcess)}</div>
        </div>
        ` : ''}
        
        ${jobData.requiredDocuments ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Required Documents:</div>
            <div class="job-detail-value">${formatText(jobData.requiredDocuments)}</div>
        </div>
        ` : ''}
        
        <!-- Contact Information -->
        ${jobData.contactPerson ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Contact Person:</div>
            <div class="job-detail-value">${displayField(jobData.contactPerson)}</div>
        </div>
        ` : ''}
        
        ${jobData.contactEmail ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Contact Email:</div>
            <div class="job-detail-value">
                <a href="mailto:${jobData.contactEmail}" style="color: #0066cc;">${jobData.contactEmail}</a>
            </div>
        </div>
        ` : ''}
        
        ${jobData.contactPhone ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Contact Phone:</div>
            <div class="job-detail-value">
                <a href="tel:${jobData.contactPhone}" style="color: #0066cc;">${jobData.contactPhone}</a>
            </div>
        </div>
        ` : ''}
        
        ${jobData.websiteUrl ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Organization Website:</div>
            <div class="job-detail-value">
                <a href="${jobData.websiteUrl}" target="_blank" rel="noopener noreferrer" style="color: #0066cc;">${jobData.websiteUrl} 🔗</a>
            </div>
        </div>
        ` : ''}
        
        <!-- Additional Information -->
        ${jobData.additionalInfo ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Additional Information:</div>
            <div class="job-detail-value">${formatText(jobData.additionalInfo)}</div>
        </div>
        ` : ''}
        
        ${jobData.notes ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Additional Notes:</div>
            <div class="job-detail-value">${formatText(jobData.notes)}</div>
        </div>
        ` : ''}
        
        ${jobData.tags ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Tags/Keywords:</div>
            <div class="job-detail-value">${displayField(jobData.tags)}</div>
        </div>
        ` : ''}
        
        <!-- Footer -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #666; font-size: 14px;">
            <p><strong>Interested in this position?</strong> Please contact the organization directly using the information provided above.</p>
            ${!jobData.contactEmail && !jobData.contactPhone ? `
            <p><em>Contact information not provided. You may need to visit the organization's website or search for their contact details online.</em></p>
            ` : ''}
        </div>
    `;
    
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
}

function closeJobDetail() {
    const modal = document.getElementById('jobDetailModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto'; // Restore background scrolling
}

// Close modal when clicking outside of it
window.onclick = function(event) {
    const modal = document.getElementById('jobDetailModal');
    if (event.target == modal) {
        closeJobDetail();
    }
}

// Close modal with Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeJobDetail();
    }
});
</script>

<body>
    <div class="header">
        <div class="title-container">
            <div class="title-row">
                <h1>NEJI</h1>
                <img src="./neji.png" alt="NEJI Network of Earth-Science Jobs India Logo" class="logo">
            </div>
            <div class="small-neji">Network of Earth-Science Jobs, India</div>
        </div>
        <div class="menu-container">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="menu-links" id="menuLinks">
                <a href="./index.html">Home</a>
                <a href="./institutes.html">Institutes</a>
                <a href="./put_your_word.html">Put your word out</a>
                <a href="./about.html">Who are we?</a>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="mb-4">Job Listings</h2>
        <div class="table-container">
            <table id="dataTable" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Job position</th>
                        <th>Organization name</th>
                        <th>Location</th>
                        <th>Posted date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Job Detail Modal -->
    <div id="jobDetailModal" class="job-detail-modal">
        <div class="job-detail-content" id="jobDetailContent">
            <!-- Content will be dynamically populated -->
        </div>
    </div>

    <script>
        // Store job data globally for modal access
        let jobsData = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec';
            
            // Configure which columns to display - easily changeable
            const columnsToShow = ['jobTitle', 'affiliation', 'location', 'timestamp'];

            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    jobsData = data; // Store data globally
                    const tableBody = document.getElementById('tableBody');
                    
                    data.forEach((row, index) => {
                        let tr = document.createElement('tr');
                        let cellsHtml = '';
                        
                        // Build cells based on columnsToShow array
                        columnsToShow.forEach(column => {
                            if (column === 'jobTitle') {
                                // Check if external link exists
                                if (row['link'] && row['link'].trim() !== '') {
                                    // External link exists - use it
                                    cellsHtml += `<td><a href="${row['link']}" target="_blank" rel="noopener noreferrer">${row[column] || ''} 🔗</a></td>`;
                                } else {
                                    // No external link - create virtual page link
                                    cellsHtml += `<td><a href="#" class="virtual-link" onclick="showJobDetail(jobsData[${index}]); return false;">${row[column] || ''} 📄</a></td>`;
                                }
                            } else {
                                cellsHtml += `<td>${row[column] || ''}</td>`;
                            }
                        });
                        
                        tr.innerHTML = cellsHtml;
                        tableBody.appendChild(tr);
                    });
                    
                    // Initialize DataTable with responsive options
                    $('#dataTable').DataTable({
                        responsive: true,
                        autoWidth: false,
                        scrollX: true,
                        columnDefs: [
                            { width: "35%", targets: 0 },
                            { width: "30%", targets: 1 },
                            { width: "20%", targets: 2 },
                            { width: "15%", targets: 3 }
                        ]
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
    
</body>
</html>
