<script>
function toggleMenu() {
    const menu = document.getElementById("menuLinks");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}

// Job detail modal functions
function showJobDetail(jobData) {
    const modal = document.getElementById('jobDetailModal');
    const content = document.getElementById('jobDetailContent');
    
    // Populate modal with job data
    content.innerHTML = `
        <span class="close-btn" onclick="closeJobDetail()">&times;</span>
        <h2 class="job-detail-title">${jobData.jobType || 'Job Position'}</h2>
        
        <div class="job-detail-section">
            <div class="job-detail-label">Organization:</div>
            <div class="job-detail-value">${[jobData.affiliation, jobData.department].filter(Boolean).join(', ') || 'Not specified'}</div>
        </div>
        
        <div class="job-detail-section">
            <div class="job-detail-label">Location:</div>
            <div class="job-detail-value">${jobData.location || 'Not specified'}</div>
        </div>
        <div class="job-detail-section">
            <div class="job-detail-label">Task:</div>
            <div class="job-detail-value">${jobData.jobDescription || 'Not specified'}
            </div>
        </div>        
        
        
        <div class="job-detail-section">
            <div class="job-detail-label">Posted Date:</div>
            <div class="job-detail-value">${jobData.timestamp || 'Not specified'}</div>
        </div>
        
        ${jobData.essentialQualities ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Qualification:</div>
            <div class="job-detail-value">${jobData.essentialQualities}</div>
        </div>
        ` : ''}
        
        ${jobData.desirableQualities ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Desirables:</div>
            <div class="job-detail-value">${jobData.desirableQualities}</div>
        </div>
        ` : ''}
        
        ${jobData.salary ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Salary/Compensation:</div>
            <div class="job-detail-value">${jobData.salary}</div>
        </div>
        ` : ''}
        
        ${jobData.email ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Contact:</div>
            <div class="job-detail-value">
                <a href="mailto:${jobData.email}" style="color: #0066cc;">${jobData.email}</a>
            </div>
        </div>
        ` : ''}
        
        ${jobData.deadline ? `
        <div class="job-detail-section">
            <div class="job-detail-label">Application Deadline:</div>
            <div class="job-detail-value">${jobData.deadline}</div>
        </div>
        ` : ''}
        
${jobData.link ? `
  <div class="job-detail-section">
    <div class="job-detail-label">Additional Information:</div>
    <div class="job-detail-value">
      <a href="${jobData.link}" target="_blank" rel="noopener noreferrer">
        ${jobData.link}
      </a>
    </div>
  </div>
` : ''}

    `;
    
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
}

function closeJobDetail() {
    const modal = document.getElementById('jobDetailModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto'; // Restore background scrolling
}

// Close modal when clicking outside of it
window.onclick = function(event) {
    const modal = document.getElementById('jobDetailModal');
    if (event.target == modal) {
        closeJobDetail();
    }
}

// Close modal with Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeJobDetail();
    }
});

// Function to parse date strings and convert to sortable format
function parseDate(dateStr) {
    if (!dateStr || dateStr.trim() === '') return 0; // Return 0 for empty dates
    
    // Clean the date string
    dateStr = dateStr.trim();
    
    // Try parsing as standard date first
    let date = new Date(dateStr);
    if (!isNaN(date.getTime())) return date.getTime();
    
    // Try common Indian date formats: DD/MM/YYYY, DD-MM-YYYY
    const ddmmyyyy = dateStr.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (ddmmyyyy) {
        const day = parseInt(ddmmyyyy[1]);
        const month = parseInt(ddmmyyyy[2]) - 1; // Month is 0-indexed
        const year = parseInt(ddmmyyyy[3]);
        date = new Date(year, month, day);
        if (!isNaN(date.getTime())) return date.getTime();
    }
    
    // Try YYYY-MM-DD format
    const yyyymmdd = dateStr.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (yyyymmdd) {
        const year = parseInt(yyyymmdd[1]);
        const month = parseInt(yyyymmdd[2]) - 1;
        const day = parseInt(yyyymmdd[3]);
        date = new Date(year, month, day);
        if (!isNaN(date.getTime())) return date.getTime();
    }
    
    // If all parsing fails, return 0
    console.log('Could not parse date:', dateStr);
    return 0;
}

// Function to handle date sorting
function applySorting(table, sortOrder) {
    if (table) {
        table.order([3, sortOrder]).draw();
    }
}
</script>

<body>
    <div class="header">
        <div class="title-container">
            <div class="title-row">
                <h1>NEJI</h1>
                <img src="./neji.png" alt="NEJI Network of Earth-Science Jobs India Logo" class="logo">
            </div>
            <div class="small-neji">Network of Earth-Science Jobs, India</div>
        </div>
        <div class="menu-container">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="menu-links" id="menuLinks">
                <a href="./index.html">Home</a>
                <a href="./institutes.html">Institutes</a>
                <a href="./put_your_word.html">Put your word out</a>
                <a href="./about.html">Who are we?</a>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="mb-4">Listings</h2>
        
        <div class="table-container">
            <table id="dataTable" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>position</th>
                        <th>Organization name</th>
                        <th>Location</th>
                        <th>Posted date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Job Detail Modal -->
    <div id="jobDetailModal" class="job-detail-modal">
        <div class="job-detail-content" id="jobDetailContent">
            <!-- Content will be dynamically populated -->
        </div>
    </div>

<script>
        // Store job data globally for modal access
        let jobsData = [];
        let dataTable; // Store DataTable instance globally
        
        document.addEventListener('DOMContentLoaded', function() {
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec';
            
            // Configure which columns to display - easily changeable
            const columnsToShow = ['jobType', 'affiliation', 'location', 'timestamp'];
            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    jobsData = data; // Store data globally
                    const tableBody = document.getElementById('tableBody');
                    
                    data.forEach((row, index) => {
                        let tr = document.createElement('tr');
                        let cellsHtml = '';
                        
                        // Build cells based on columnsToShow array
                        columnsToShow.forEach(column => {
                            if (column === 'jobType') {
                                // Check if external link exists
                                if (row['link'] && row['link'].trim() !== '') {
                                    // External link exists - use it
                                    cellsHtml += `<td><a href="${row['link']}" target="_blank" rel="noopener noreferrer">${row[column] || ''} 🔗</a></td>`;
                                } else {
                                    // No external link - create virtual page link
                                    cellsHtml += `<td><a href="#" class="virtual-link" onclick="showJobDetail(jobsData[${index}]); return false;">${row[column] || ''} 📄</a></td>`;
                                }
                            } else {
                                cellsHtml += `<td>${row[column] || ''}</td>`;
                            }
                        });
                        
                        tr.innerHTML = cellsHtml;
                        tableBody.appendChild(tr);
                    });
                    
                    // First, let's add timestamps to our data for proper sorting
                    console.log('Sample data for debugging:', data.slice(0, 3));
                    data.forEach(row => {
                        row.sortableDate = parseDate(row.timestamp);
                        console.log('Date:', row.timestamp, '-> Sortable:', row.sortableDate, '-> Readable:', new Date(row.sortableDate));
                    });
                    
                    // Initialize DataTable with custom date sorting
                    dataTable = $('#dataTable').DataTable({
                        responsive: {
                            details: {
                                type: 'column',
                                target: 'tr'
                            }
                        },
                        autoWidth: false,
                        scrollX: false,
                        scrollCollapse: true,
                        fixedHeader: false,
                        order: [[3, 'desc']], // Default sort by date column (newest first)
                        columnDefs: [
                            { width: "35%", targets: 0, className: "text-wrap" },
                            { width: "30%", targets: 1, className: "text-wrap" },
                            { width: "20%", targets: 2, className: "text-wrap" },
                            { 
                                width: "15%", 
                                targets: 3, 
                                className: "text-wrap",
                                render: function(data, type, row, meta) {
                                    if (type === 'sort' || type === 'type') {
                                        // Use the pre-calculated sortable date
                                        return jobsData[meta.row] ? jobsData[meta.row].sortableDate : 0;
                                    }
                                    return data; // Return original data for display
                                }
                            }
                        ],
                        drawCallback: function() {
                            // Ensure header and body alignment after each redraw
                            this.api().columns.adjust();
                        },
                        initComplete: function() {
                            // Force column adjustment after initialization
                            this.api().columns.adjust();
                            
                            // Add window resize handler to maintain alignment
                            $(window).on('resize', () => {
                                clearTimeout(window.resizeTimer);
                                window.resizeTimer = setTimeout(() => {
                                    this.api().columns.adjust();
                                }, 250);
                            });
                        }
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
    
</body>
