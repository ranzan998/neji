<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean and Earth science Jobs</title>
        <link
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .header {
            display: flex;
            margin-bottom: 20px;
        }
        .title-row {
            display: flex;
            align-items: center;
        }
        .title-container {
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0;
            color: #333;
        }
        .small-neji {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #666;
            margin-top: 0px;
        }
        .logo {
            height: auto;
            width: 120px;
            margin-left: 15px;
        }
        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 15px;
        }
        
        /* Responsive table styling */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        
        table {
            width: 100% !important;
            border-collapse: collapse;
            table-layout: auto; /* Changed from fixed to auto */
            min-width: 100%;
        }
        
        /* DataTables wrapper styling */
        .dataTables_wrapper {
            width: 100%;
        }
        
        .dataTables_wrapper .dataTables_scroll {
            width: 100%;
        }
        
        .dataTables_wrapper .dataTables_scrollBody {
            width: 100%;
        }
        
        tr {
            border-bottom: 1px solid #ddd;
        }
        
        td, th {
            padding: 12px 15px;
            word-wrap: break-word;
            white-space: normal; /* Allow text wrapping */
            vertical-align: top;
        }
        
        /* Column width distribution */
        th:nth-child(1), td:nth-child(1) { /* Job position */
            width: 35%;
            min-width: 200px;
        }
        
        th:nth-child(2), td:nth-child(2) { /* Organization */
            width: 30%;
            min-width: 150px;
        }
        
        th:nth-child(3), td:nth-child(3) { /* Location */
            width: 20%;
            min-width: 120px;
        }
        
        th:nth-child(4), td:nth-child(4) { /* Posted date */
            width: 15%;
            min-width: 100px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        th {
            font-weight: bold;
            color: #0a2f66; /* dark blue */
            background-color: #eef3fb;
            text-align: left;
        }
        
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 1000;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        .menu-links {
            display: none;
            flex-direction: column;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .menu-links a {
            text-decoration: none;
            color: #0a2f66;
            font-weight: 500;
            padding: 6px 0;
            display: block;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
            
            .logo {
                width: 80px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .small-neji {
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            th, td {
                padding: 6px 8px;
                font-size: 12px;
            }
            
            th:nth-child(1), td:nth-child(1) {
                min-width: 150px;
            }
            
            th:nth-child(2), td:nth-child(2) {
                min-width: 120px;
            }
            
            th:nth-child(3), td:nth-child(3) {
                min-width: 100px;
            }
            
            th:nth-child(4), td:nth-child(4) {
                min-width: 80px;
            }
        }
    </style>
</head>

<script>
function toggleMenu() {
    const menu = document.getElementById("menuLinks");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
</script>

<body>
    <div class="header">
        <div class="title-container">
            <div class="title-row">
                <h1>NEJI</h1>
                <img src="./neji.png" alt="NEJI Network of Earth-Science Jobs India Logo" class="logo">
            </div>
            <div class="small-neji">Network of Earth-Science Jobs, India</div>
        </div>
        <div class="menu-container">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="menu-links" id="menuLinks">
                <a href="./index.html">Home</a>
                <a href="./institutes.html">Institutes</a>
                <a href="./put_your_word.html">Put your word out</a>
                <a href="./about.html">Who are we?</a>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="mb-4">Job Listings</h2>
        <div class="table-container">
            <table id="dataTable" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Job position</th>
                        <th>Organization name</th>
                        <th>Location</th>
                        <th>Posted date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxjjgXGVAXyLBDQqHbnFssoNMw86pzPNBVdno66pjt5svrAQUOkufI0CQpMw5yniEMe/exec';
            
            // Configure which columns to display - easily changeable
            const columnsToShow = ['jobTitle', 'affiliation', 'location', 'timestamp'];

            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('tableBody');
                    data.forEach(row => {
                        let tr = document.createElement('tr');
                        let cellsHtml = '';
                        
                        // Build cells based on columnsToShow array
                        columnsToShow.forEach(column => {
                            if (column === 'jobTitle') {
                                // Check if link exists for this job title
                                if (row['link'] && row['link'].trim() !== '') {
                                    cellsHtml += `<td><a href="${row['link']}" target="_blank" rel="noopener noreferrer">${row[column] || ''} 🔗</a></td>`;
                                } else {
                                    cellsHtml += `<td>${row[column] || ''}</td>`;
                                }
                            } else {
                                cellsHtml += `<td>${row[column] || ''}</td>`;
                            }
                        });
                        
                        tr.innerHTML = cellsHtml;
                        tableBody.appendChild(tr);
                    });
                    
                    // Initialize DataTable with responsive options
                    $('#dataTable').DataTable({
                        responsive: true,
                        autoWidth: false,
                        scrollX: true,
                        columnDefs: [
                            { width: "35%", targets: 0 },
                            { width: "30%", targets: 1 },
                            { width: "20%", targets: 2 },
                            { width: "15%", targets: 3 }
                        ]
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
    
</body>
</html>
